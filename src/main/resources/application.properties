spring.application.name=CampuSphere

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_campus
spring.datasource.username=root
spring.datasource.password=2648

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8081

# AI Configuration
# Set the OPENAI_API_KEY environment variable before running
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=gpt-4o-mini

# Python ML Microservice Configuration
ml.service.url=${ML_SERVICE_URL:http://127.0.0.1:8000}