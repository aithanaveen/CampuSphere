<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — CampuSphere AI</title>
    <meta name="description" content="Reset your CampuSphere AI account password securely.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }

        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            background-attachment: fixed;
            padding: 60px 16px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        body::before {
            content: '';
            position: fixed;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(102,126,234,0.18) 0%, transparent 70%);
            top: -100px; right: -100px;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(118,75,162,0.18) 0%, transparent 70%);
            bottom: -80px; left: -80px;
            pointer-events: none;
            z-index: 0;
        }

        .page-wrapper {
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            color: #fff;
        }

        .brand-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.35);
        }

        .brand-title {
            color: #fff; font-weight: 700; font-size: 1.5rem; text-align: center; margin-bottom: 4px;
        }
        .brand-subtitle {
            color: rgba(255,255,255,0.6); font-size: 0.88rem; text-align: center; margin-bottom: 28px;
        }

        .form-label {
            color: rgba(255,255,255,0.85); font-size: 0.82rem; font-weight: 600; margin-bottom: 6px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff; border-radius: 10px; padding: 12px 16px; font-size: 0.92rem;
            transition: all 0.25s;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.13);
            border-color: #667eea; color: #fff;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.3);
        }
        .form-control::placeholder { color: rgba(255,255,255,0.3); }

        .btn-reset {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none; border-radius: 10px; color: #fff;
            font-weight: 600; font-size: 0.98rem; letter-spacing: 0.3px;
            transition: all 0.25s;
            margin-top: 10px;
        }
        .btn-reset:hover {
            transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.45); color: #fff;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-left: none; color: rgba(255,255,255,0.5); cursor: pointer;
        }
        .input-group .form-control { border-right: none; }

        .strength-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); margin-top: 6px; overflow: hidden; }
        .strength-fill { height: 100%; width: 0; transition: width 0.3s, background 0.3s; }

        .alert-custom {
            border-radius: 10px; font-size: 0.88rem; padding: 12px 16px; margin-top: 18px; display: none;
        }
        .alert-custom.alert-error {
            background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); color: #fca5a5; display: block;
        }
        .alert-custom.alert-success {
            background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.35); color: #6ee7b7; display: block;
        }

        .back-link {
            text-align: center; margin-top: 24px; font-size: 0.88rem; color: rgba(255,255,255,0.55);
        }
        .back-link a { color: #a5b4fc; text-decoration: none; font-weight: 600; }
        .back-link a:hover { text-decoration: underline; color: #fff; }

        footer {
            text-align: center; color: rgba(255,255,255,0.3); font-size: 0.8rem; margin-top: 40px; position: relative; z-index: 10;
        }
        footer a { color: rgba(255,255,255,0.4); text-decoration: none; }
        footer a:hover { color: #667eea; }
    </style>
</head>
<body>

<div class="page-wrapper">
    <div class="auth-card">
        <div class="brand-icon">
            <i class="bi bi-key-fill text-white"></i>
        </div>
        <h1 class="brand-title">Reset Password</h1>
        <p class="brand-subtitle">Enter your registered email and choose a new password</p>

        <form id="forgotPasswordForm" onsubmit="handleResetPassword(event)">
            <div class="mb-3">
                <label class="form-label">Registered Email</label>
                <div class="input-group">
                    <input type="email" id="email" class="form-control" placeholder="e.g. naveen@campus.edu" required autocomplete="email">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <div class="input-group">
                    <input type="password" id="newPassword" class="form-control" placeholder="At least 6 characters" required oninput="checkStrength()">
                    <span class="input-group-text" onclick="togglePasswordVisibility('newPassword', 'toggleIcon1')">
                        <i class="bi bi-eye" id="toggleIcon1"></i>
                    </span>
                </div>
                <div class="strength-bar"><div id="strengthFill" class="strength-fill"></div></div>
                <div id="strengthText" style="font-size:0.75rem; color:rgba(255,255,255,0.4); margin-top:4px;"></div>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm New Password</label>
                <div class="input-group">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter new password" required>
                    <span class="input-group-text" onclick="togglePasswordVisibility('confirmPassword', 'toggleIcon2')">
                        <i class="bi bi-eye" id="toggleIcon2"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-reset" id="resetBtn">
                <i class="bi bi-shield-lock me-1"></i>Reset Password
            </button>
        </form>

        <div id="alertBox" class="alert-custom"></div>

        <div class="back-link">
            Remembered your password? <a href="/login"><i class="bi bi-arrow-left me-1"></i>Back to Sign In</a>
        </div>
    </div>
</div>

<footer>
    © 2026 CampuSphere AI — Event Management System &nbsp;·&nbsp;
    <a href="/login">Login</a> &nbsp;·&nbsp;
    <a href="/register">Register</a>
</footer>

<script>
function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
    }
}

function checkStrength() {
    const pwd = document.getElementById('newPassword').value;
    const fill = document.getElementById('strengthFill');
    const text = document.getElementById('strengthText');
    if (!pwd) { fill.style.width='0%'; text.textContent=''; return; }

    let score = 0;
    if (pwd.length >= 6) score++;
    if (pwd.length >= 8) score++;
    if (/[A-Z]/.test(pwd)) score++;
    if (/[0-9]/.test(pwd)) score++;
    if (/[^A-Za-z0-9]/.test(pwd)) score++;

    if (score <= 2) {
        fill.style.width = '33%'; fill.style.background = '#ef4444';
        text.textContent = 'Weak password'; text.style.color = '#fca5a5';
    } else if (score <= 4) {
        fill.style.width = '66%'; fill.style.background = '#f59e0b';
        text.textContent = 'Moderate password'; text.style.color = '#fcd34d';
    } else {
        fill.style.width = '100%'; fill.style.background = '#10b981';
        text.textContent = 'Strong password'; text.style.color = '#6ee7b7';
    }
}

async function handleResetPassword(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const alertBox = document.getElementById('alertBox');
    const resetBtn = document.getElementById('resetBtn');

    if (newPassword !== confirmPassword) {
        alertBox.className = 'alert-custom alert-error';
        alertBox.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i>Passwords do not match.';
        return;
    }

    if (newPassword.length < 6) {
        alertBox.className = 'alert-custom alert-error';
        alertBox.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i>Password must be at least 6 characters.';
        return;
    }

    resetBtn.disabled = true;
    resetBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Updating password...';
    alertBox.style.display = 'none';

    try {
        const response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, newPassword })
        });

        const data = await response.json();

        if (response.ok) {
            alertBox.className = 'alert-custom alert-success';
            alertBox.innerHTML = `
                <div class="fw-bold mb-1"><i class="bi bi-check-circle-fill me-2"></i>Success!</div>
                <div>${data.message || 'Your password has been updated.'}</div>
                <div class="mt-2"><a href="/login" class="btn btn-sm btn-light text-dark fw-bold px-3 py-1">Proceed to Sign In &rarr;</a></div>
            `;
            document.getElementById('forgotPasswordForm').reset();
            document.getElementById('strengthFill').style.width = '0%';
            document.getElementById('strengthText').textContent = '';
        } else {
            alertBox.className = 'alert-custom alert-error';
            alertBox.innerHTML = `<i class="bi bi-x-circle-fill me-2"></i>${data.message || 'Failed to reset password.'}`;
        }
    } catch (err) {
        alertBox.className = 'alert-custom alert-error';
        alertBox.innerHTML = '<i class="bi bi-wifi-off me-2"></i>Network error. Please try again.';
    } finally {
        resetBtn.disabled = false;
        resetBtn.innerHTML = '<i class="bi bi-shield-lock me-1"></i>Reset Password';
    }
}
</script>

</body>
</html>
