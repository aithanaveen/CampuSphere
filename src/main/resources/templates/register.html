<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — CampuSphere AI</title>
    <meta name="description" content="Create your student account on CampuSphere AI">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }

        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            background-attachment: fixed;
            /* FIX: removed display:flex align-items:center that was clipping form */
            padding: 50px 16px 30px;
        }

        /* Animated background orbs */
        body::before {
            content: '';
            position: fixed;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(102,126,234,0.18) 0%, transparent 70%);
            top: -100px; right: -100px;
            animation: pulse 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(118,75,162,0.18) 0%, transparent 70%);
            bottom: -80px; left: -80px;
            animation: pulse 6s ease-in-out infinite reverse;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .page-wrapper {
            max-width: 540px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .register-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 22px;
            padding: 40px 36px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.45);
        }

        /* brand */
        .brand-icon {
            width: 68px; height: 68px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px;
            font-size: 30px;
            box-shadow: 0 8px 24px rgba(102,126,234,0.4);
        }
        .brand-title {
            color: #fff; font-weight: 700; font-size: 1.55rem;
            text-align: center; margin-bottom: 4px;
        }
        .brand-sub {
            color: rgba(255,255,255,0.45); font-size: 0.88rem;
            text-align: center; margin-bottom: 28px;
        }

        /* divider */
        .section-div {
            text-align: center; color: rgba(255,255,255,0.35);
            font-size: 0.7rem; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; margin: 22px 0 18px;
            position: relative;
        }
        .section-div::before, .section-div::after {
            content: '';
            position: absolute; top: 50%;
            width: 36%; height: 1px;
            background: rgba(255,255,255,0.1);
        }
        .section-div::before { left: 0; }
        .section-div::after { right: 0; }

        /* form controls */
        .form-label {
            color: rgba(255,255,255,0.8);
            font-size: 0.82rem; font-weight: 600; letter-spacing: 0.3px;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            background: rgba(255,255,255,0.07);
            border: 1.5px solid rgba(255,255,255,0.14);
            color: #fff; border-radius: 11px;
            padding: 11px 14px; font-size: 0.92rem;
            transition: all 0.25s;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.12);
            border-color: #667eea; color: #fff;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.22);
            outline: none;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.28); }
        .form-select option { background: #1a1a2e; color: #fff; }

        /* password toggle */
        .pw-wrap { position: relative; }
        .pw-eye {
            position: absolute; right: 14px; top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.35); cursor: pointer;
            font-size: 1rem; user-select: none; z-index: 5;
            transition: color 0.2s;
        }
        .pw-eye:hover { color: rgba(255,255,255,0.7); }

        /* strength bar */
        .strength-bar {
            height: 4px; border-radius: 4px;
            background: rgba(255,255,255,0.1); margin-top: 6px;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%; border-radius: 4px;
            transition: width 0.3s, background 0.3s;
            width: 0%;
        }
        .strength-label {
            font-size: 0.72rem; color: rgba(255,255,255,0.35);
            margin-top: 3px; height: 14px;
        }

        /* interest hint */
        .interest-hint {
            color: rgba(255,255,255,0.3); font-size: 0.74rem; margin-top: 5px;
        }

        /* submit btn */
        .btn-submit {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none; border-radius: 11px;
            color: #fff; font-weight: 700; font-size: 1rem;
            letter-spacing: 0.3px; margin-top: 10px;
            transition: all 0.25s;
            cursor: pointer;
        }
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(102,126,234,0.45);
        }
        .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

        /* alerts */
        .alert-box {
            border-radius: 11px; padding: 13px 16px;
            font-size: 0.88rem; margin-top: 16px;
            display: none;
        }
        .alert-box.success {
            background: rgba(17,153,142,0.15);
            border: 1px solid rgba(17,153,142,0.35);
            color: #38ef7d; display: block;
        }
        .alert-box.error {
            background: rgba(220,53,69,0.15);
            border: 1px solid rgba(220,53,69,0.35);
            color: #ff6b7a; display: block;
        }

        /* login link */
        .login-link {
            text-align: center; margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.4); font-size: 0.86rem;
        }
        .login-link a { color: #667eea; font-weight: 600; text-decoration: none; }
        .login-link a:hover { color: #a78bfa; }

        /* footer */
        footer {
            text-align: center; margin-top: 28px;
            color: rgba(255,255,255,0.2); font-size: 0.76rem;
            position: relative; z-index: 10;
        }
        footer a { color: rgba(255,255,255,0.3); text-decoration: none; }
        footer a:hover { color: #667eea; }
    </style>
</head>
<body>

<div class="page-wrapper">
    <div class="register-card">

        <div class="brand-icon">🎓</div>
        <h1 class="brand-title">Create Account</h1>
        <p class="brand-sub">CampuSphere AI · Event Management System</p>

        <form id="registerForm" novalidate autocomplete="off">

            <!-- Personal Info -->
            <div class="section-div">Personal Info</div>

            <div class="mb-3">
                <label class="form-label" for="name">
                    <i class="bi bi-person me-1"></i>Full Name <span style="color:#ff6b7a;">*</span>
                </label>
                <input type="text" id="name" class="form-control"
                    placeholder="e.g. Arjun Sharma" required autocomplete="name">
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">
                    <i class="bi bi-envelope me-1"></i>Email Address <span style="color:#ff6b7a;">*</span>
                </label>
                <input type="email" id="email" class="form-control"
                    placeholder="e.g. arjun@college.edu" required autocomplete="email">
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">
                    <i class="bi bi-lock me-1"></i>Password <span style="color:#ff6b7a;">*</span>
                </label>
                <div class="pw-wrap">
                    <input type="password" id="password" class="form-control"
                        placeholder="Min. 6 characters" required autocomplete="new-password"
                        oninput="checkStrength(this.value)">
                    <span class="pw-eye" onclick="togglePw('password','pwEye')" id="pwEye">
                        <i class="bi bi-eye-slash"></i>
                    </span>
                </div>
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <div class="strength-label" id="strengthLabel"></div>
            </div>

            <!-- Academic Info -->
            <div class="section-div">Academic Info</div>

            <div class="row g-3 mb-3">
                <div class="col-8">
                    <label class="form-label" for="department">
                        <i class="bi bi-building me-1"></i>Department <span style="color:#ff6b7a;">*</span>
                    </label>
                    <select id="department" class="form-select" required>
                        <option value="">Select department</option>
                        <option>Computer Science</option>
                        <option>Information Technology</option>
                        <option>Electronics & Communication</option>
                        <option>Electrical Engineering</option>
                        <option>Mechanical Engineering</option>
                        <option>Civil Engineering</option>
                        <option>Business Administration</option>
                        <option>Mathematics</option>
                        <option>Physics</option>
                        <option>Chemistry</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="col-4">
                    <label class="form-label" for="year">
                        <i class="bi bi-calendar3 me-1"></i>Year <span style="color:#ff6b7a;">*</span>
                    </label>
                    <select id="year" class="form-select" required>
                        <option value="">Year</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                </div>
            </div>

            <div class="mb-1">
                <label class="form-label" for="interests">
                    <i class="bi bi-stars me-1"></i>Interests
                    <span style="color:rgba(255,255,255,0.35); font-weight:400;">(optional)</span>
                </label>
                <input type="text" id="interests" class="form-control"
                    placeholder="e.g. Technology, AI, Sports, Cultural">
                <div class="interest-hint">
                    <i class="bi bi-info-circle me-1"></i>
                    Comma-separated — used by AI for event recommendations
                </div>
            </div>

            <!-- Interest Tag Preview -->
            <div id="tagPreview" class="d-flex flex-wrap gap-1 mt-2 mb-3" style="min-height:24px;"></div>

            <button type="submit" class="btn btn-submit" id="registerBtn">
                <i class="bi bi-person-plus me-2"></i>Create Account
            </button>

        </form>

        <div id="alertBox" class="alert-box"></div>

        <div class="login-link">
            Already have an account? <a href="/login">Sign in here</a>
        </div>

    </div>

    <footer>
        © 2026 CampuSphere AI — Event Management System &nbsp;·&nbsp;
        <a href="/login">Login</a> &nbsp;·&nbsp; Powered by 🤖 AI
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Redirect if already logged in
const existingAuth = localStorage.getItem('auth');
if (existingAuth) {
    fetch('/api/auth/me', { headers: { 'Authorization': 'Basic ' + existingAuth } })
        .then(r => { if (r.ok) window.location.href = '/dashboard'; })
        .catch(() => {});
}

// ── Password toggle ─────────────────────────────────────
function togglePw(id, iconId) {
    const f = document.getElementById(id);
    const i = document.getElementById(iconId);
    if (f.type === 'password') {
        f.type = 'text';
        i.innerHTML = '<i class="bi bi-eye"></i>';
    } else {
        f.type = 'password';
        i.innerHTML = '<i class="bi bi-eye-slash"></i>';
    }
}

// ── Password strength meter ──────────────────────────────
function checkStrength(val) {
    const fill = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    let score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const config = [
        { pct: '0%',   bg: 'transparent',                      text: '' },
        { pct: '25%',  bg: '#ff6b6b',                          text: '⚠ Weak' },
        { pct: '50%',  bg: '#f5a623',                          text: '⚡ Fair' },
        { pct: '75%',  bg: '#4facfe',                          text: '👍 Good' },
        { pct: '100%', bg: 'linear-gradient(90deg,#11998e,#38ef7d)', text: '✅ Strong' },
    ];
    const c = config[Math.min(score, 4)];
    fill.style.width = c.pct;
    fill.style.background = c.bg;
    label.textContent = c.text;
    label.style.color = c.bg.includes('gradient') ? '#38ef7d' : c.bg;
}

// ── Interest tag preview ─────────────────────────────────
document.getElementById('interests').addEventListener('input', function() {
    const preview = document.getElementById('tagPreview');
    preview.innerHTML = '';
    this.value.split(',').forEach(tag => {
        const t = tag.trim();
        if (!t) return;
        const span = document.createElement('span');
        span.style.cssText = 'background:rgba(102,126,234,0.2);border:1px solid rgba(102,126,234,0.35);border-radius:20px;padding:3px 12px;font-size:0.76rem;color:rgba(255,255,255,0.75)';
        span.textContent = t;
        preview.appendChild(span);
    });
});

// ── Alert helpers ────────────────────────────────────────
function showAlert(msg, type) {
    const box = document.getElementById('alertBox');
    box.textContent = msg;
    box.className = 'alert-box ' + type;
}
function hideAlert() {
    const box = document.getElementById('alertBox');
    box.className = 'alert-box';
}

// ── Form submit ──────────────────────────────────────────
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const name       = document.getElementById('name').value.trim();
    const email      = document.getElementById('email').value.trim();
    const password   = document.getElementById('password').value;
    const department = document.getElementById('department').value;
    const year       = document.getElementById('year').value;
    const interests  = document.getElementById('interests').value.trim();
    const btn        = document.getElementById('registerBtn');

    // Validate
    if (!name || !email || !password || !department || !year) {
        showAlert('⚠️ Please fill in all required fields.', 'error'); return;
    }
    if (password.length < 6) {
        showAlert('⚠️ Password must be at least 6 characters.', 'error'); return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showAlert('⚠️ Please enter a valid email address.', 'error'); return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';
    hideAlert();

    try {
        const response = await fetch('/api/students', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name, email, password,
                department,
                year: parseInt(year),
                interests: interests || null,
                role: 'STUDENT'
            })
        });

        if (response.ok) {
            showAlert('✅ Account created successfully! Redirecting to login...', 'success');
            setTimeout(() => { window.location.href = '/login'; }, 2000);
        } else {
            const data = await response.json().catch(() => null);
            const msg  = data?.message || 'Registration failed. This email may already be in use.';
            showAlert('❌ ' + msg, 'error');
        }

    } catch (err) {
        showAlert('❌ Unable to connect to the server. Please try again.', 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Create Account';
    }
});
</script>

</body>
</html>
