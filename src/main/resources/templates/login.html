<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampuSphere — Login</title>
    <meta name="description" content="CampuSphere — Smart Campus Event Management System">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        * { font-family: 'Inter', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            position: relative;
            overflow: hidden;
        }

        /* Animated background orbs */
        body::before {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(102,126,234,0.15) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            animation: pulse 6s ease-in-out infinite;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(118,75,162,0.15) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            animation: pulse 6s ease-in-out infinite reverse;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            width: 100%;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }

        .brand-title {
            color: #fff;
            font-weight: 700;
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-label {
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: #667eea;
            color: #fff;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.25);
        }

        .form-control::placeholder { color: rgba(255,255,255,0.3); }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.3px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
        }

        .btn-login:active { transform: translateY(0); }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert-error {
            background: rgba(220,53,69,0.15);
            border: 1px solid rgba(220,53,69,0.3);
            color: #ff6b7a;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.9rem;
            display: none;
            margin-top: 16px;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.45);
            font-size: 0.87rem;
        }

        .register-link a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover { color: #764ba2; }

        .spinner-border-sm { width: 1rem; height: 1rem; }

        /* ===== FOOTER ===== */
        footer {
            width: 100%;
            position: relative;
            z-index: 10;
            padding: 16px 20px;
            text-align: center;
        }

        footer p {
            color: rgba(255,255,255,0.25);
            font-size: 0.78rem;
            margin: 0;
        }

        footer a {
            color: rgba(255,255,255,0.35);
            text-decoration: none;
        }

        footer a:hover { color: #667eea; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <div class="brand-icon">🎓</div>
        <h1 class="brand-title">CampuSphere</h1>
        <p class="brand-subtitle">Smart Campus Event Management System</p>

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label" for="email">
                    <i class="bi bi-envelope me-1"></i> Email Address
                </label>
                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label mb-0" for="password">
                        <i class="bi bi-lock me-1"></i> Password
                    </label>
                    <a href="/forgot-password" style="font-size:0.8rem; color:#a5b4fc; text-decoration:none;">Forgot password?</a>
                </div>
                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit" class="btn btn-login" id="loginBtn">
                Sign In
            </button>

        </form>

        <div id="errorMessage" class="alert-error">
            <i class="bi bi-exclamation-circle me-2"></i>
            <span id="errorText">Invalid email or password. Please try again.</span>
        </div>

        <div class="register-link">
            Don't have an account? <a href="/register">Register here</a>
        </div>

    </div>
</div>

<footer>
    <p>
        © 2026 CampuSphere — Event Management System &nbsp;·&nbsp;
        <a href="/register">Register</a> &nbsp;·&nbsp;
        Powered by 🤖 AI
    </p>
</footer>

<script>
// If already logged in, don't stay on login page
const existingAuth = localStorage.getItem('auth');
if (existingAuth) {
    verifyAndRedirect(existingAuth);
}

async function verifyAndRedirect(credentials) {
    try {
        const response = await fetch('/api/auth/me', {
            headers: { 'Authorization': 'Basic ' + credentials }
        });
        if (response.ok) {
            const user = await response.json();
            redirectByRole(user.role);
        }
    } catch (e) {
        localStorage.removeItem('auth');
    }
}

function redirectByRole(role) {
    if (role === 'ADMIN') {
        window.location.href = '/admin';
    } else {
        window.location.href = '/dashboard';
    }
}

document.getElementById('loginForm').addEventListener('submit', async function (event) {
    event.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const loginBtn = document.getElementById('loginBtn');
    const errorDiv = document.getElementById('errorMessage');

    if (!email || !password) return;

    // Show loading state
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';
    errorDiv.style.display = 'none';

    const credentials = btoa(email + ':' + password);

    try {
        const response = await fetch('/api/auth/me', {
            method: 'GET',
            headers: { 'Authorization': 'Basic ' + credentials }
        });

        if (response.ok) {
            const user = await response.json();

            // Store credentials in localStorage for subsequent API calls
            localStorage.setItem('auth', credentials);

            // Route based on ACTUAL role from backend — never by email pattern
            redirectByRole(user.role);

        } else if (response.status === 401) {
            showError('Invalid email or password. Please try again.');
        } else {
            showError('Login failed. Server returned status ' + response.status);
        }

    } catch (error) {
        console.error('Login error:', error);
        showError('Unable to connect to the server. Please check your connection.');
    } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'Sign In';
    }
});

function showError(message) {
    const errorDiv = document.getElementById('errorMessage');
    document.getElementById('errorText').textContent = message;
    errorDiv.style.display = 'block';
}
</script>

</body>
</html>
